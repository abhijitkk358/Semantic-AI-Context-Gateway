version: '3.8'

services:

  # ── Redis Stack (vector database) ─────────────────────────────────────────
  semantic-redis-cache:
    image: redis/redis-stack-server:latest
    container_name: semantic-redis-cache
    ports:
      - "6379:6379"
      - "8001:8001"       # RedisInsight web UI
    volumes:
      - redis_vector_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Semantic AI Context Gateway ────────────────────────────────────────────
  semantic-gateway:
    build: .
    container_name: semantic-gateway
    ports:
      - "8000:8000"
    depends_on:
      semantic-redis-cache:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://semantic-redis-cache:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1/}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  redis_vector_data:

version: '3.8'
services:
  semantic-redis-cache:
    image: redis/redis-stack-server:latest
    container_name: semantic-redis-cache
    ports:
      - "6379:6379"
      - "8001:8001"       # RedisInsight web UI
    volumes:
      - redis_vector_data:/data
    restart: always

volumes:
  redis_vector_data:
